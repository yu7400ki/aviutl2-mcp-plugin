[package]
name = "aviutl2-mcp-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AviUtl2 MCP Plugin (.aux2)"
publish = false

[lib]
name = "aviutl2_mcp_plugin"
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
aviutl2-mcp-core = { workspace = true }
chrono = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proptest = "1.6.0"

# SDK ラッパーと Win32 API は Windows でのみ解決する。
# 実装は全て `#[cfg(windows)]` 配下にあり、他プラットフォームでは参照されない。
[target.'cfg(windows)'.dependencies]
aviutl2 = "0.41.0"
aviutl2-mcp-win = { workspace = true }
win32-ui = { git = "https://github.com/yu7400ki/win32-ui.git", rev = "bf52be16ee16977b5b3bf6c5587f5827f67dc778" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# 保護 DACL の表明はテストからのみ使う。
[target.'cfg(windows)'.dev-dependencies]
aviutl2-mcp-win = { workspace = true, features = ["test-support"] }
